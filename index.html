<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KharchaWise</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" rel="stylesheet" />
</head>

<body>
    <!-- Authorization -->
    <div id="auth-container" class="centered">


        <div id="email-login-container">
            <h1>KharchaWise</h1>
            <input type="email" id="email-input" placeholder="Enter your email" required />
            <input type="password" id="password-input" placeholder="Enter your password" required />
            <button id="login-btn">Login</button>
            <p>Don't have an account? <a href="#" id="show-signup">Sign Up</a></p>
            <button id="google-signin-btn">
                <i class="fab fa-google"></i> Sign in with Google
            </button>


            <div id="message-container"></div>
        </div>

        <div id="signup-container" style="display: none;">
            <h1>KharchaWise</h1>
            <input type="email" id="signup-email" placeholder="Enter your email" required />
            <input type="password" id="signup-password" placeholder="Enter your password" required />
            <button id="signup-btn">Sign Up</button>
            <p>Already have an account? <a href="#" id="show-login">Login</a></p>
            <button id="google-signin-btn">
                <i class="fab fa-google"></i> Sign in with Google
            </button>


            <div id="message-container-signup"></div>
        </div>
    </div>



    <!-- Main -->

    <main id="main-content">
        <div id="navbar">
            <div id="logo">KharchaWise</div>
            <button id="signout-btn">
                <i class="fas fa-sign-out-alt"></i>
            </button>
        </div>
        <div id="main">
            <div class="content-box">
                
            </div>
            <div class="content-box"><button id="addNewBtn" class="on-btn">Add New</button></div>
            <div class="content-box">
                
            </div>
            <div class="content-box">
                
            </div>


        </div>

        <!-- transactionForm -->
        <div id="transactionForm">

            <div class="input-group-add" style="width: 100%;justify-content: space-around;">
                <button class="on-btn" id="expenseBtn" data-value="Expense"
                    onclick="selectOption('Expense')">EXPENSE</button>
                <button class="on-btn" id="incomeBtn" data-value="Income"
                    onclick="selectOption('Income')">INCOME</button>
                <button class="on-btn" id="transferBtn" data-value="Transfer"
                    onclick="selectOption('Transfer')">TRANSFER</button>
            </div>

            <div class="input-group-add" style="flex-direction: column;">
                <label for="account">Account</label>
                <select id="account">
                    <option value="" disabled selected>Select an account </option>
                </select>
            </div>

            <div id="toAccountGroup" class="input-group-add" style="flex-direction: column;">
                <label for="toAccount">To Account</label>
                <select id="toAccount">
                    <option value="" disabled selected>Select an account </option>
                </select>
            </div>

            <div id="expenseCategoryGroup" class="input-group-add" style="flex-direction: column;">
                <label for="expenseCategory">Expense Category</label>
                <select id="expenseCategory">
                    <option value="" disabled selected>Select a category</option>
                </select>
            </div>

            <div class="input-group-add" style="flex-direction: column; height: auto;">
                <label for="description">Description</label>
                <textarea id="description" rows="3"></textarea>
            </div>

            <div class="input-group-add" style="flex-direction: column;">
                <label for="dateField">Select a date</label>
                <input type="date" id="dateField"
                    style="width: 100%;font-size: 16px;border: 1px solid maroon;border-radius: 4px;box-sizing: border-box;padding: 0.5rem;">
            </div>

            <div class="input-group-add">
                <input type="text" id="numberInput" readonly>
            </div>

            <div class="calculator">
                <button class="calc-btn" data-value="1">1</button>
                <button class="calc-btn" data-value="2">2</button>
                <button class="calc-btn" data-value="3">3</button>
                <button class="calc-btn" data-operation="+">+</button>
                <button class="calc-btn" data-value="4">4</button>
                <button class="calc-btn" data-value="5">5</button>
                <button class="calc-btn" data-value="6">6</button>
                <button class="calc-btn" data-operation="-">-</button>
                <button class="calc-btn" data-value="7">7</button>
                <button class="calc-btn" data-value="8">8</button>
                <button class="calc-btn" data-value="9">9</button>
                <button class="calc-btn" data-operation="*">*</button>
                <button class="calc-btn" data-value="0">0</button>
                <button class="calc-btn" id="clear">Clr</button>
                <button class="calc-btn" id="equals">=</button>
                <button class="calc-btn" data-operation="/">/</button>
            </div>
            <button id="addsubmitBtn" class="on-btn">Submit</button>
            <button id="addcancelBtn" class="on-btn">Cancel</button>
        </div>




    </main>

    <script src="firebase.js" defer type="module"></script>
    <script src="script.js" defer type="module"></script>
</body>

</html>
